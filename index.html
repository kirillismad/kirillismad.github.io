<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f1e7">
    <meta name="color-scheme" content="light">
    <meta name="format-detection" content="telephone=no">
    <title>Комнатные растения ищут новый дом</title>
    <meta name="description" content="Я переезжаю и отдаю свои комнатные растения в хорошие руки.">
    <style>
        :root {
            --paper: #f6f1e7;
            --forest: #1f3a2b;
            --sage: #8a9e86;
            --sage-light: #dfe5d6;
            --rule: #cfd5c4;
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            overflow-wrap: break-word;
            background: var(--paper);
            color: var(--forest);
            font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
            font-size: 1.0625rem;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            max-width: 68rem;
            margin: 0 auto;
            padding: clamp(1rem, 6vw, 6rem) clamp(1.25rem, 5vw, 3rem);
            padding-left: max(clamp(1rem, 5vw, 3rem), env(safe-area-inset-left));
            padding-right: max(clamp(1rem, 5vw, 3rem), env(safe-area-inset-right));
            padding-bottom: max(clamp(2rem, 6vw, 6rem), env(safe-area-inset-bottom));
        }

        .contact {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.75rem;
            margin: 0 0 clamp(2.5rem, 6vw, 4.5rem);
            padding: 0;
            list-style: none;
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .contact a {
            display: inline-block;
            min-height: 44px;
            line-height: 44px;
            color: var(--forest);
            text-decoration: none;
            border-bottom: 1px solid var(--sage);
        }

        .contact a:hover,
        .contact a:focus-visible {
            color: var(--sage);
        }

        header {
            max-width: 40rem;
            margin-bottom: clamp(1.75rem, 4vw, 2.5rem);
        }

        .eyebrow {
            margin: 0 0 1rem;
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--sage);
        }

        h1 {
            margin: 0 0 1.75rem;
            font-weight: 400;
            font-size: clamp(2.5rem, 8vw, 5rem);
            line-height: 1.05;
            letter-spacing: -0.02em;
        }

        h1 em {
            font-style: italic;
            color: var(--sage);
        }

        header p {
            margin: 0;
            max-width: 34rem;
        }

        .rule {
            border: 0;
            border-top: 1px solid var(--rule);
            margin: 0 0 clamp(2rem, 5vw, 3.5rem);
        }

        .grid {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(2rem, 5vw, 3.5rem) clamp(1.25rem, 3vw, 2.5rem);
            counter-reset: plant;
        }

        .grid>li {
            counter-increment: plant;
        }

        figcaption::before {
            content: counter(plant) ".";
            margin-right: 0.3em;
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.3;
        }

        figure {
            margin: 0;
            position: relative;
        }

        /* Плашки показываются для зарезервированных и уже забранных растений. */
        .status {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            z-index: 1;
            margin: 0;
            padding: 0.3rem 0.65rem;
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 0.68rem;
            line-height: 1.4;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            pointer-events: none;
        }

        .is-reserved .status {
            background: var(--paper);
            color: var(--forest);
            border: 1px solid var(--forest);
        }

        .is-reserved .photo {
            filter: saturate(0.5);
        }

        .is-taken .status {
            background: var(--sage);
            color: var(--paper);
            border: 1px solid var(--sage);
        }

        .is-taken .photo {
            filter: grayscale(1);
            opacity: 0.45;
        }

        .is-taken figcaption::before,
        .is-taken .name {
            color: var(--sage);
        }

        .is-taken .name {
            text-decoration: line-through;
            text-decoration-thickness: 1px;
        }

        .is-taken .note {
            opacity: 0.5;
        }

        .zoom {
            display: block;
            width: 100%;
            padding: 0;
            border: 0;
            background: none;
            cursor: zoom-in;
        }

        body:has(#viewer[open]) {
            overflow: hidden;
        }

        #viewer {
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            border: 0;
            background: rgba(20, 38, 28, 0.96);
            cursor: zoom-out;
        }

        #viewer[open] {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #viewer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .photo {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            background: var(--sage-light);
        }

        /* Заглушка: замените <div class="photo placeholder"> на <img class="photo"> */
        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--sage);
            border: 1px dashed var(--sage);
        }

        figcaption {
            padding-top: 0.9rem;
        }

        .name {
            display: inline;
            margin: 0;
            font-size: 1.25rem;
            font-style: italic;
            line-height: 1.3;
        }

        .note {
            margin: 0.25rem 0 0;
            font-size: 0.95rem;
            line-height: 1.5;
            opacity: 0.8;
        }

        footer {
            margin-top: clamp(3.5rem, 8vw, 6rem);
            padding-top: 1.5rem;
            border-top: 1px solid var(--rule);
            font-size: 0.95rem;
        }

        footer p {
            margin: 0;
            max-width: 34rem;
        }

        @media (max-width: 40rem) {
            body {
                font-size: 1rem;
                line-height: 1.55;
            }

            /* Три равных крупных области для нажатия пальцем */
            .contact {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 0.5rem;
                margin-bottom: 1.75rem;
                font-size: 0.72rem;
                letter-spacing: 0.1em;
            }

            .contact a {
                display: block;
                min-height: 48px;
                line-height: 46px;
                text-align: center;
                border: 1px solid var(--forest);
            }

            .contact a:active {
                background: var(--sage-light);
            }

            header {
                margin-bottom: 1.25rem;
            }

            h1 {
                font-size: 2.6rem;
                margin-bottom: 1rem;
            }

            .rule {
                margin-bottom: 1.25rem;
            }

            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem 0.75rem;
            }

            figcaption::before,
            .name {
                font-size: 1.05rem;
            }

            .note {
                font-size: 0.875rem;
            }

            .status {
                top: 0.5rem;
                left: 0.5rem;
                padding: 0.25rem 0.5rem;
                font-size: 0.6rem;
                letter-spacing: 0.12em;
            }

            figcaption {
                padding-top: 0.6rem;
            }

            footer {
                margin-top: 2.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="page">

        <header data-content="intro"></header>

        <nav data-content="contacts">
            <ul class="contact"></ul>
        </nav>

        <hr class="rule">

        <main>
            <ul class="grid" data-content="plants"></ul>
        </main>

        <dialog id="viewer" aria-label="Просмотр фото"><img alt=""></dialog>

        <script>
            const pageContent = {
                location: 'ЖК «Золотая Гавань»',
                headingStart: 'Растения ищут ',
                headingEmphasis: 'новый дом',
                introduction: 'Я переезжаю, и растения поехать со мной не смогут. За каждым из них я много лет ухаживаю, и теперь они готовы украсить чей-то подоконник. Посмотрите и напишите, если кто-то приглянулся.',
                contactsLabel: 'Связаться со мной',
                contacts: [
                    { label: 'Позвонить', href: 'tel:+79696541730' },
                    { label: 'SMS', href: 'sms:+79696541730' },
                    { label: 'Telegram', href: 'https://t.me/tatakozinska' }
                ],
                plants: [
                    // { image: 'IMG_5417', name: 'Юкка слоновая (Yucca elephantipes)', status: 'active' },
                    // { image: 'IMG_5418', name: 'Фикус Эластика Абиджан (Ficus Elastica Abidjan)', note: 'Высота 75 см', status: 'active' },
                    // { image: 'IMG_5419', name: 'Сансевиерия Хана (Sansevieria hahnii)', status: 'taken' },
                    { image: 'IMG_5420', name: 'Сансевиерия Хана (Sansevieria hahnii)', status: 'active' },
                    { image: 'IMG_5421', name: 'Сансевиерия Хана (Sansevieria hahnii)', status: 'active' },
                    { image: 'IMG_5422', name: 'Сансевиерия Хана (Sansevieria hahnii)', status: 'active' },
                    { image: 'IMG_5423', name: 'Сансевиерия Хана (Sansevieria hahnii)', status: 'active' },
                    { image: 'IMG_5424', name: 'Толстянка (Crássula)', status: 'active' },
                    // { image: 'IMG_5425', name: 'Орхидея Фаленопсис (Phalaenopsis)', note: 'Высота 25 см. Есть свежие цветоносы', status: 'active' },
                    // { image: 'IMG_5426', name: 'Хавортия полосатая (Haworthiopsis fasciata)', status: 'taken' },
                    // { image: 'IMG_5427', name: 'Гастерия Dragon Skin', title: 'Гастерия или близкий суккулент', alt: 'Сансевиерия', status: 'taken' },
                    // { image: 'IMG_5428', name: 'Сансевиерия цилиндрическая (Sansevieria cylindrica) 90см', note: 'Сансевиерия трехполосая (Sansevieria trifasciata), Хавортия полосатая (Haworthiopsis fasciata)', status: 'active' },
                    // { image: 'IMG_5429', name: 'Кротон (Codiaeum variegatum)', title: 'Кротон (кодиеум)', status: 'active' },
                    // { image: 'IMG_5430', name: 'Замиокулькас (Zamioculcas)', alt: 'Замиокулькас', note: 'Высота — около 95 см.', status: 'active' },
                    // { image: 'IMG_5431', name: 'Аихризон (Aichryson)', status: 'active' },
                    // { image: 'IMG_5432', name: 'Фикус микрокарпа «Гинсенг» (Ficus microcarpa \'Ginseng\')', note: 'Высота 25 см', status: 'active' },
                    // { image: 'IMG_5433', name: 'Орхидея Фаленопсис (Phalaenopsis)', title: 'Орхидея фаленопсис', alt: 'Фикус каучуконосный', note: 'Высота 25 см. Есть свежие цветоносы', status: 'active' },
                    // { image: 'IMG_5416', name: 'Фикус Эластика Абиджан (Ficus Elastica Abidjan)', alt: 'Фикус Эластика Абиджан, рядом кот', note: 'Высота 95 см', status: 'active' }
                ]
            };

            const statusLabels = {
                reserved: 'Забронировано',
                taken: 'Забрали'
            };

            function createElement(tagName, className, text) {
                const element = document.createElement(tagName);
                if (className) element.className = className;
                if (text !== undefined) element.textContent = text;
                return element;
            }

            const intro = document.querySelector('[data-content="intro"]');
            intro.append(createElement('p', 'eyebrow', pageContent.location));
            const heading = createElement('h1');
            heading.append(document.createTextNode(pageContent.headingStart));
            heading.append(createElement('em', '', pageContent.headingEmphasis));
            intro.append(heading, createElement('p', '', pageContent.introduction));

            const contactsNav = document.querySelector('[data-content="contacts"]');
            contactsNav.setAttribute('aria-label', pageContent.contactsLabel);
            const contactsList = contactsNav.querySelector('.contact');
            pageContent.contacts.forEach(function (contact) {
                const link = createElement('a', '', contact.label);
                link.href = contact.href;
                const item = createElement('li');
                item.append(link);
                contactsList.append(item);
            });

            const plantList = document.querySelector('[data-content="plants"]');
            pageContent.plants.forEach(function (plant, index) {
                const status = plant.status;
                const item = createElement('li', 'is-' + status);
                item.dataset.status = status;
                const figure = createElement('figure');
                if (statusLabels[status]) figure.append(createElement('p', 'status', statusLabels[status]));

                const button = createElement('button', 'zoom');
                button.type = 'button';
                button.title = plant.title || plant.name;
                button.setAttribute('aria-label', 'Увеличить фото ' + (index + 1));

                const image = createElement('img', 'photo');
                image.src = 'images/webp/small/' + plant.image + '.webp';
                image.dataset.full = 'images/webp/big/' + plant.image + '.webp';
                image.width = 600;
                image.height = 800;
                image.alt = plant.alt || 'Комнатное растение в горшке';
                image.decoding = 'async';
                if (index > 0) image.loading = 'lazy';
                button.append(image);

                const caption = createElement('figcaption', '', plant.name);
                if (plant.note) caption.append(createElement('p', 'note', plant.note));
                figure.append(button, caption);
                item.append(figure);
                plantList.append(item);
            });

            const viewer = document.getElementById('viewer');
            const viewerImg = viewer.querySelector('img');
            plantList.addEventListener('click', function (event) {
                const button = event.target.closest('.zoom');
                if (!button) return;

                const img = button.querySelector('img');
                viewerImg.src = img.dataset.full || img.currentSrc || img.src;
                viewerImg.alt = img.alt;
                viewer.showModal();
                history.pushState({ viewer: true }, '');
            });
            viewer.addEventListener('click', function () { viewer.close(); });

            // Жест «назад» и кнопка «назад» закрывают просмотр, а не уходят со страницы
            viewer.addEventListener('close', function () {
                if (history.state && history.state.viewer) history.back();
            });
            window.addEventListener('popstate', function () {
                if (viewer.open) viewer.close();
            });
        </script>

    </div>
</body>

</html>
